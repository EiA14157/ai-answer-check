<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11161e">
<meta name="description" content="AI 답변처럼 보이는 세 문장 중 한 문장의 오류를 찾는 한국어 퀴즈. 로그인과 외부 연결이 필요 없습니다.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>AI 오답 찾기</title>
<style>
:root{color-scheme:dark;--bg:#11161e;--panel:#18212b;--line:#354454;--ink:#f3f5ed;--muted:#bec9d3;--lime:#caff72;--green:#b7f6b4;--orange:#ffbaaa}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
header{border-bottom:1px solid var(--line);background:#141c25}
.bar,.wrap{width:min(100% - 2rem,680px);margin:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:1rem 0}
.brand{font-weight:800;display:flex;align-items:center;gap:.65rem}.brand i{font:900 .9rem system-ui;background:var(--lime);color:#162431;border-radius:9px;width:2rem;height:2rem;display:grid;place-items:center;font-style:normal}
.sidenote{color:var(--muted);font-size:.85rem}.wrap{padding:2rem 0 1rem}
.hero{display:grid;align-content:center;min-height:min(480px,60vh);padding:2rem;background:radial-gradient(ellipse at 100% 0%,#33483e 0%,transparent 61%),var(--panel);border:1px solid var(--line);border-radius:22px}
h1,h2,p{margin-top:0}h1{font-size:clamp(2rem,7vw,3.55rem);line-height:1.14;letter-spacing:-.06em;margin-bottom:1rem}h2{font-size:clamp(1.45rem,4vw,1.95rem);line-height:1.3;letter-spacing:-.04em;margin-bottom:.55rem}h1 em{color:var(--lime);font-style:normal}.hero p{color:var(--muted);max-width:29rem;margin-bottom:1.5rem}.eyebrow{font:800 .85rem system-ui;color:var(--lime);letter-spacing:.08em;margin-bottom:.8rem;display:block}
button{font:inherit;cursor:pointer}.primary{width:fit-content;font-weight:800;color:#182026;background:var(--lime);border:0;border-radius:12px;padding:.75rem 1.1rem;min-height:46px}.primary:hover{background:#e1ffb8}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #e4f9a8;outline-offset:3px}
.score-row{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);margin-bottom:.5rem}.score-row strong{color:var(--lime)}
progress{appearance:none;display:block;width:100%;height:7px;border:0;border-radius:999px;background:var(--line);margin-bottom:1.2rem}progress::-webkit-progress-bar{border-radius:999px;background:var(--line)}progress::-webkit-progress-value{border-radius:999px;background:var(--lime)}progress::-moz-progress-bar{border-radius:999px;background:var(--lime)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.3rem}.scenario{color:var(--muted);margin-bottom:0}
fieldset{border:0;padding:0;margin:1.35rem 0 0;min-inline-size:0}legend{padding:0;margin-bottom:.7rem;font-weight:750}
.choices{display:grid;gap:.55rem}.choice{display:grid;grid-template-columns:2rem 1fr;align-items:center;gap:.65rem;text-align:left;width:100%;padding:.67rem .75rem;color:var(--ink);background:#18212b;border:1px solid var(--line);border-radius:12px;min-height:50px}.choice:not(:disabled):hover{border-color:var(--lime);background:#202c30}.choice:disabled{cursor:default;opacity:1}.pill{display:grid;place-items:center;width:2rem;height:2rem;border-radius:7px;font-weight:800;color:var(--muted);background:#2b3742}.choice.correct{border-color:var(--green);background:#263832}.choice.correct .pill{background:var(--green);color:#17241d}.choice.incorrect{border-color:var(--orange);background:#442e2d}.choice.incorrect .pill{background:var(--orange);color:#33201e}
.feedback{margin-top:1rem;padding:1rem 1.1rem;border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:10px;background:var(--panel)}.feedback strong{display:block;margin:0 0 .25rem}.feedback p{margin:0;color:var(--muted)}.next-row{display:flex;justify-content:flex-end;margin-top:1rem}
.result-number{font-size:clamp(3.2rem,12vw,5.8rem);letter-spacing:-.07em;line-height:1.05;margin:.3rem 0 1rem;font-weight:850;color:var(--lime);font-variant-numeric:tabular-nums}
footer{width:min(100% - 2rem,680px);margin:1rem auto 2rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}
noscript{display:block;padding:1rem}
@media(max-width:400px){.hero{padding:1.25rem}.wrap{padding-top:1.2rem}.sidenote{display:none}.card{padding:1rem}}
</style>
</head>
<body>
<header><div class="bar"><span class="brand"><i aria-hidden="true">?</i> AI 오답 찾기</span><span class="sidenote">문장 속 오류 찾기</span></div></header>
<main class="wrap">
<section class="hero" id="intro" aria-labelledby="intro-title">
<span class="eyebrow">열 문제 · 한 문장씩</span>
<h1 id="intro-title">그럴듯한 답변,<br><em>어디가 틀렸을까?</em></h1>
<p>AI 답변처럼 보이는 세 문장 중 틀린 문장은 하나뿐이에요. 문제의 조건을 읽고, 오답을 찾아보세요.</p>
<button class="primary" type="button" id="start">퀴즈 시작</button>
</section>
<section id="game" hidden aria-labelledby="question-title">
<div class="score-row"><span id="counter"></span><strong id="score"></strong></div>
<progress id="progress" max="10" value="0" aria-label="완료한 문제 수"></progress>
<div class="card"><span class="eyebrow" id="tag"></span><h2 id="question-title" tabindex="-1"></h2><p class="scenario" id="scenario"></p></div>
<fieldset aria-describedby="scenario"><legend>틀린 문장을 하나 선택하세요.</legend><div class="choices" id="choices"></div></fieldset>
<div class="feedback" id="feedback" hidden><strong id="feedback-title" role="status"></strong><p id="explanation"></p></div>
<div class="next-row" id="next-row" hidden><button class="primary" type="button" id="next" aria-describedby="explanation">다음 문제</button></div>
</section>
<section class="hero" id="result" hidden aria-labelledby="result-title">
<span class="eyebrow">퀴즈 결과</span>
<h2 id="result-title" tabindex="-1">검증 완료!</h2>
<div class="result-number" id="result-score"></div>
<p id="result-copy"></p>
<button class="primary" type="button" id="restart">다시 풀기</button>
</section>
<noscript>게임을 시작하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</main>
<footer>이 앱은 AI 답변처럼 만든 예시의 내용이 맞는지 검증하는 게임입니다. 실제 AI 생성 여부는 판별하지 않습니다. <a href="https://buymeacoffee.com/eia14157" target="_blank" rel="noopener noreferrer">☕ 커피 한 잔 후원하기</a></footer>
<script id="bank" type="application/json">
[

    "answers":["첫 할인 직후 가격은 40,000원입니다.","결제 금액은 35,000원입니다.","정가 대비 최종 할인율은 28%입니다."],
    "wrong":1,"why":"두 번째 10%는 정가가 아니라 40,000원의 10%인 4,000원입니다. 그래서 결제 금액은 36,000원입니다."
  },
  {
    "tag":"데이터 해석","title":"두 반을 하나로 합치면",
    "prompt":"A반 10명의 평균은 90점, B반 30명의 평균은 70점입니다.",
    "answers":["두 반을 합친 인원은 40명입니다.","B반 학생들의 점수 합은 2,100점입니다.","두 반을 합친 평균은 80점입니다."],
    "wrong":2,"why":"인원 수가 다른 반의 평균을 단순히 평균 내면 안 됩니다. 합계 3,000점을 40명으로 나누면 75점입니다."

    "answers":["유나가 행사 소식 문자를 받았다면 예약한 사람입니다.","유나는 예약한 사람이 아닙니다.","행사 소식 문자만으로는 예약 여부를 확정할 수 없습니다."],
    "wrong":0,"why":"행사 소식 문자와 예약 확인 문자는 다릅니다. 확인 문자를 받지 못한 유나는 제시된 조건상 예약자가 아닙니다."

  {

    "answers":["750W는 0.75kW입니다.","이 기기가 소모한 에너지는 30kWh입니다.","같은 기기를 20분만 사용했다면 에너지 사용량은 절반입니다."],
    "wrong":1,"why":"kWh를 계산할 때 시간은 시간 단위로 바꿔야 합니다. 0.75kW × (40÷60)시간은 0.5kWh입니다."
  },
  {
    "tag":"확률","title":"연달아 파란 구슬이 나올까?",
    "prompt":"주머니에 파란 구슬 3개, 노란 구슬 2개가 있습니다. 보지 않고 구슬을 하나씩 두 번 뽑으며, 뽑은 구슬은 다시 넣지 않습니다.",
    "answers":["첫 구슬이 파란색일 확률은 3/5입니다.","첫 구슬이 파란색이었다면 두 번째 구슬이 파란색일 확률은 1/2입니다.","두 번 모두 파란색일 확률은 9/25입니다."],
    "wrong":2,"why":"첫 파란 구슬을 되돌려 넣지 않으므로, 두 번째는 남은 4개 중 파란 구슬 2개입니다. 3/5 × 2/4 = 3/10입니다."

    "prompt":"빵집 기록에서 비가 온 날 빵의 평균 판매량은 120개, 비가 안 온 날은 100개였습니다. 요일·행사 여부는 기록하지 않았습니다.",
    "answers":["이 기록은 비가 판매량을 늘린 원인임을 확정합니다.","기록에 나타난 두 집단의 평균 차이는 20개입니다.","비가 온 날 모두 120개씩 팔렸다고 할 수는 없습니다."],
    "wrong":0,"why":"요일이나 행사가 판매량 차이에 영향을 줬을 수 있습니다. 관찰된 평균 차이만으로 비의 인과 효과를 확정할 수 없습니다."

    "answers":["첫 번째 버튼을 누른 뒤 값은 5입니다.","네 번째 버튼을 누른 뒤 값은 2입니다.","세 번째 버튼을 누른 직후 값은 0입니다."],
    "wrong":1,"why":"순서대로 5 → 8 → 0 → 3입니다. 0으로 초기화한 뒤 다음 입력은 3을 더합니다."

  {

    "prompt":"월요일 시식 고객 100명 중 40명이 샀고, 화요일 시식 고객 50명 중 30명이 샀습니다.",
    "answers":["월요일에 화요일보다 10명 더 샀습니다.","화요일의 구매율은 60%입니다.","화요일의 구매율은 월요일보다 20% 낮습니다."],
    "wrong":2,"why":"월요일 구매율은 40%, 화요일은 60%입니다. 낮아진 게 아니라 20%포인트 높아졌습니다."
  },
  {
    "tag":"시간 계산","title":"마감 시각을 맞혀라",
    "prompt":"작업은 14:20에 시작했습니다. 준비 35분, 휴식 10분, 본 작업 50분을 순서대로 진행하고 사이에 별도의 공백은 없었습니다.",
    "answers":["모든 과정은 15:45에 끝났습니다.","휴식은 14:55에 시작했습니다.","본 작업은 15:05에 시작했습니다."],
    "wrong":0,"why":"14:20에 35분, 10분, 50분을 더하면 총 95분 뒤인 15:55입니다."
  },
  {
    "tag":"집합 계산","title":"두 활동에 모두 참여했을까?",
    "prompt":"동아리원 20명 중 발표에 참여한 사람은 12명, 행사 운영에 참여한 사람은 11명입니다. 4명은 두 활동 모두에 참여하지 않았습니다.",
    "answers":["두 활동 중 적어도 하나에 참여한 사람은 16명입니다.","두 활동에 모두 참여한 사람은 3명입니다.","발표에만 참여한 사람은 5명입니다."],
    "wrong":1,"why":"두 활동의 인원을 합치면 23명처럼 보이지만, 실제 참가자는 16명입니다. 중복된 7명이 두 활동에 모두 참여했습니다."
  }

</script>
<script>
'use strict';
const questions = JSON.parse(document.getElementById('bank').textContent);
const get = id => document.getElementById(id);
let index = 0, points = 0, locked = false, order = [];
const letters = ['A','B','C'];
function start() {
  index = 0;
  points = 0;
  get('intro').hidden = true;
  get('result').hidden = true;
  get('game').hidden = false;
  render();
}
function stats() {
  get('counter').textContent = '문제 ' + (index + 1) + ' / ' + questions.length;
  get('score').textContent = '정답 ' + points + '개';
  get('progress').value = index + Number(locked);
}
function render() {
  locked = false;
  const q = questions[index];
  order = q.answers.map((_, i) => i);
  for (let i = order.length - 1; i > 0; --i) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  stats();
  get('tag').textContent = q.tag;
  get('question-title').textContent = q.title;
  get('scenario').textContent = q.prompt;
  get('feedback').hidden = true;
  get('next-row').hidden = true;
  get('choices').replaceChildren(...order.map((answerIndex, i) => {
    const button = document.createElement('button');
    const pill = document.createElement('span');
    const label = document.createElement('span');
    button.type = 'button';
    button.className = 'choice';
    pill.className = 'pill';
    pill.textContent = letters[i];
    pill.setAttribute('aria-hidden','true');
    label.textContent = q.answers[answerIndex];
    button.append(pill,label);
    button.addEventListener('click', () => pick(i));
    return button;
  }));
  get('question-title').focus();
}
function pick(selected) {
  if (locked) return;
  locked = true;
  const q = questions[index];
  const wrongPosition = order.indexOf(q.wrong);
  const correct = selected === wrongPosition;
  points += Number(correct);
  stats();
  Array.from(get('choices').children).forEach((button, i) => {
    button.disabled = true;
    if (i === wrongPosition) button.classList.add('correct');
    else if (i === selected) button.classList.add('incorrect');
  });
  get('feedback-title').textContent = (correct ? '맞았어요.' : '아쉬워요.') + ' 오답은 ' + letters[wrongPosition] + '입니다.';
  get('explanation').textContent = q.why;
  get('feedback').hidden = false;
  get('next').textContent = index + 1 === questions.length ? '결과 보기' : '다음 문제';
  get('next-row').hidden = false;
  get('next').focus({preventScroll:true});
}
function next() {
  if (!locked) return;
  if (++index < questions.length) {
    render();
    return;
  }
  get('game').hidden = true;
  get('result-score').textContent = points + ' / ' + questions.length;
  get('result-copy').textContent = points === questions.length ? '열 문항의 오류를 모두 찾았어요.' : '열 문항 중 ' + points + '개의 오류를 찾았어요.';
  get('result').hidden = false;
  get('result-title').focus();
}
get('start').addEventListener('click', start);
get('restart').addEventListener('click', start);
get('next').addEventListener('click', next);
</script>
</body>
</html>
